name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Run the scaffold checks
        if: matrix.runner == 'ubuntu-latest'
        run: nix shell --inputs-from . nixpkgs#devenv --command devenv --no-tui shell -- just check

      - name: Evaluate all supported platforms
        if: matrix.runner == 'ubuntu-latest'
        run: nix flake check --no-write-lock-file --no-build --all-systems

      - name: Build and test the package
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Run the packaged binary
        run: nix run --no-write-lock-file . -- --version
